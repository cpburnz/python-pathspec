name: Publish to PyPI
on:
  release:
    types:
      - released

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1 from 2026-07-20.
        with:
          persist-credentials: false

      - uses: ironsh/iron-proxy-action@fa1fd82ec32396d044deba7040a6db576bec927a  # v0.1.4 from 2026-04-28.
        with:
          egress-rules: .github/egress-build-rules.yaml

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0 from 2026-07-19.
        with:
          cache: pip
          python-version: '3.x'

      - name: Install pypa/build
        run: python3 -m pip install --user build

      - name: Build a binary wheel and a source tarball
        run: python3 -m build

      - name: Store the distribution packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1 from 2026-04-10.
        with:
          name: python-package-distributions
          path: dist/

      - uses: ironsh/iron-proxy-action/summary@fa1fd82ec32396d044deba7040a6db576bec927a  # v0.1.4 from 2026-04-28.
        if: always()

  publish-to-pypi:
    name: Publish Python distribution to PyPI
    needs:
      - build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pathspec
    permissions:
      id-token: write  # IMPORTANT: mandatory for trusted publishing

    steps:
      - name: Download all the dists
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1 from 2026-03-11.
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish distribution to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2 from 2026-07-29.
        with:
          print-hash: true
