name: Test Cross

permissions:
  contents: read

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  test:
    name: Test / ${{ matrix.python }} (${{ matrix.backend }}) / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}-latest
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu
          - macos
          - windows
        python:
          - '3.9'
          - '3.14'
        backend:
          - base
          - hyperscan
          - re2
        exclude:
          # Only run MacOS / 3.14 / base for the cross test.
          - python: '3.9'
            os: macos
          - os: macos
            backend: hyperscan
          - os: macos
            backend: re2
          # For Ubuntu, only run extra backends with 3.14 for cross test.
          - python: '3.9'
            os: ubuntu
            backend: hyperscan
          - python: '3.9'
            os: ubuntu
            backend: re2
          # Only run Windows / 3.14 / base for the cross test.
          - python: '3.9'
            os: windows
          - os: windows
            backend: hyperscan
          - os: windows
            backend: re2

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1 from 2026-07-20.

      - uses: ironsh/iron-proxy-action@fa1fd82ec32396d044deba7040a6db576bec927a  # v0.1.4 from 2026-04-28.
        if: matrix.os == 'ubuntu'
        with:
          egress-rules: .github/egress-build-rules.yaml

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0 from 2026-07-19.
        with:
          allow-prereleases: true
          cache: pip
          python-version: ${{ matrix.python }}

      - name: Install tox
        run: python -m pip install tox

      - name: Run tests
        if: matrix.python != '3.9' && matrix.python != 'pypy-3.9'
        run: python -m tox -e ci-${{ matrix.backend }} -- --verbose

      - name: Run tests (3.9)
        if: matrix.python == '3.9' || matrix.python == 'pypy-3.9'
        run: python -m tox -c tox-ci-py39.ini -e ci-${{ matrix.backend }} -- --verbose

      - uses: ironsh/iron-proxy-action/summary@fa1fd82ec32396d044deba7040a6db576bec927a  # v0.1.4 from 2026-04-28.
        if: always() && matrix.os == 'ubuntu'

  docs:
    # Test documentation builds.
    # This environment mirrors the ReadTheDocs build environment.
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1 from 2026-07-20.

      - uses: ironsh/iron-proxy-action@fa1fd82ec32396d044deba7040a6db576bec927a  # v0.1.4 from 2026-04-28.
        with:
          egress-rules: .github/egress-build-rules.yaml

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0 from 2026-07-19.
        with:
          cache: pip
          python-version: '3.13'

      - name: Install tox
        run: python -m pip install tox

      - name: Run tests
        run: python -m tox -e docs

      - uses: ironsh/iron-proxy-action/summary@fa1fd82ec32396d044deba7040a6db576bec927a  # v0.1.4 from 2026-04-28.
        if: always()
