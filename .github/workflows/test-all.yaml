name: Test All

permissions:
  contents: read

on:
  workflow_dispatch:

jobs:
  test:
    name: Test / ${{ matrix.python }} (${{ matrix.backend }}) / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}-latest
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu
          - macos
          - windows
        python:
          - '3.9'
          - '3.10'
          - '3.11'
          - '3.12'
          - '3.13'
          - '3.14'
          - '3.15'
          - 'pypy-3.9'
          - 'pypy-3.10'
          - 'pypy-3.11'
          - 'pypy-3.12'
        backend:
          - base
          - hyperscan
          - re2
        exclude:
          # PyPy 3.12 is not available from actions/setup-python for Ubuntu yet
          # as of 2026-10-17.
          - os: ubuntu
            python: 'pypy3.12'
          # Hyperscan does hot have wheels for Python 3.9 on Windows.
          - os: windows
            python: '3.9'
            backend: hyperscan
          # Re2 does not have wheels for Python 3.15 yet as of 2026-10-17.
          - python: '3.15'
            backend: re2
          # Hyperscan does not have wheels for PyPy 3.9, 3.11, and 3.12.
          - python: 'pypy-3.9'
            backend: hyperscan
          - python: 'pypy-3.11'
            backend: hyperscan
          - python: 'pypy-3.12'
            backend: hyperscan
          # Hyperscan does hot have wheels for PyPy 3.10 and 3.12 on Mac.
          - os: macos
            python: 'pypy-3.10'
            backend: hyperscan
          # Hyperscan does hot have wheels for PyPy 3.10 and 3.12 on Windows.
          - os: windows
            python: 'pypy-3.10'
            backend: hyperscan
          # Re2 does hot have wheels for PyPy.
          - python: 'pypy-3.9'
            backend: re2
          - python: 'pypy-3.10'
            backend: re2
          - python: 'pypy-3.11'
            backend: re2
          - python: 'pypy-3.12'
            backend: re2

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1 from 2026-07-20.

      - uses: ironsh/iron-proxy-action@fa1fd82ec32396d044deba7040a6db576bec927a  # v0.1.4 from 2026-04-28.
        if: matrix.os == 'ubuntu'
        with:
          egress-rules: .github/egress-build-rules.yaml

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0 from 2026-07-19.
        with:
          allow-prereleases: true
          cache: pip
          python-version: ${{ matrix.python }}

      - name: Install tox
        run: python -m pip install tox -c tox-ci-constraints.txt

      - name: Run tests
        if: matrix.python != '3.9' && matrix.python != 'pypy-3.9'
        run: python -m tox -e ci-${{ matrix.backend }} -- --verbose

      - name: Run tests (3.9)
        if: matrix.python == '3.9' || matrix.python == 'pypy-3.9'
        run: python -m tox -c tox-ci-py39.ini -e ci-${{ matrix.backend }} -- --verbose

      - uses: ironsh/iron-proxy-action/summary@fa1fd82ec32396d044deba7040a6db576bec927a  # v0.1.4 from 2026-04-28.
        if: always() && matrix.os == 'ubuntu'

  docs:
    # Test documentation builds.
    # This environment mirrors the ReadTheDocs build environment.
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1 from 2026-07-20.

      - uses: ironsh/iron-proxy-action@fa1fd82ec32396d044deba7040a6db576bec927a  # v0.1.4 from 2026-04-28.
        with:
          egress-rules: .github/egress-build-rules.yaml

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0 from 2026-07-19.
        with:
          cache: pip
          python-version: '3.13'

      - name: Install tox
        run: python -m pip install tox

      - name: Run tests
        run: python -m tox -e docs

      - uses: ironsh/iron-proxy-action/summary@fa1fd82ec32396d044deba7040a6db576bec927a  # v0.1.4 from 2026-04-28.
        if: always()
